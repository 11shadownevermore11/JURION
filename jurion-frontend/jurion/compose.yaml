services:
  frontend:
    build:
      context: .
      args:
        # true — демо на встроенных моках (бэкенд не нужен); false — реальный API
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
